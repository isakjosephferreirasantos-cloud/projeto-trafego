{% extends "base.html" %}
{% block title %}Entrar · Simulador de Fluxo Urbano{% endblock %}
{% block content %}
<section class="auth-layout">
    <div class="auth-aside management-cover">
        <p class="eyebrow">Área de gestão</p>
        <h1>Fluxo <span class="text-green">ST</span></h1>
        <div class="auth-decoration" aria-hidden="true"><span>↗</span><i></i><i></i><i></i></div>
    </div>
    <div class="auth-card">
        <p class="eyebrow">Bem-vindo de volta</p>
        <h2>Acessar sua conta</h2>
        <p class="muted">Use seu e-mail e sua senha para continuar.</p>
        <form method="post" class="form-stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required autofocus value="{{ request.form.get('email', '') }}">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>
            <label class="check-row"><input type="checkbox" name="lembrar"> Manter conectado neste dispositivo</label>
            <button class="button button-wide" type="submit">Entrar <span aria-hidden="true">→</span></button>
        </form>
        <p class="auth-foot">Ainda não tem uma conta? <a class="text-link" href="{{ url_for('auth.registro') }}">Cadastre-se</a></p>
    </div>
</section>
{% endblock %}
